meta:
  description: Tabulated ingredients of the Ocelot-type reference noise model of the repetition cat code (dem/models.py)
  built_by: tools/build_ocelot_noise_table.py
  sources:
    stabilizers: our dressed-ladder ULE fault tables, data/validation/stabilizer_faults_large_nbar.csv (paper App. D); zero-fit
      or lambda = 3 on-gate ancilla decay (lambda derived from Ocelot CX^2, logical and erasure data, paper Sec. 6, App. H)
    dispersive: our dressed-ladder dispersive phase, data/validation/syndrome_phase.csv (paper App. H)
    herald_window: our f->e herald while waiting for the other CX layer, data/validation/zenodo_erasures.csv model columns
      (paper App. H)
    idle: 'DATA-DERIVED: Ocelot Fig. 16 static protocol (Putterman et al., Nature 638, 927 (2025)), Pauli per 2.8-us cycle,
      continued as A exp(-B nbar) fitted on 2 <= nbar <= 4 (examples/bias_ceiling_ocelot.py)'
